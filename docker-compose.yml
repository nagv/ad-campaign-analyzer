services:
  dashboard:
    build: .
    image: ad-campaign-analyzer
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  tests:
    build: .
    profiles: ["test"]
    command: sh -c "pip install -q pytest pytest-cov && pytest --cov=src"
    user: root
